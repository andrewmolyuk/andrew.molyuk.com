# yaml-language-server: $schema=https://raw.githubusercontent.com/bunderlog/hathi/main/schema.json
#
# hathi's settings for this repo: the commit types in full, so Claude reads the format here
# through CLAUDE.md; every other Check is on with its defaults.

conventional-commits:
  types: [build, chore, ci, docs, feat, fix, perf, refactor, revert, style, test]
